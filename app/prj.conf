CONFIG_LOG=y
CONFIG_THREAD_NAME=y

# Reduce time slice for each thread to 1ms so there is a bigger chance
# to observe the race condition with a 150 MHz CPU
CONFIG_TIMESLICE_SIZE=1

# ZBUS configuration
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=32

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_DEVICE_RANDOM_GENERATOR=y

CONFIG_TASK_WDT=y
CONFIG_WATCHDOG=y